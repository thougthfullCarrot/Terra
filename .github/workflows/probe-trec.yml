# Temporary: tries TREC's open data set on data.texas.gov. Removed before merge.
name: Probe TREC
on:
  push:
    branches: [claude/project-thread-qweiqx]
    paths: ['.github/workflows/probe-trec.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://data.texas.gov/resource/s7ft-44qi.json
          q() { echo "=== $1"; curl -sS -m 120 -G "$B" --data-urlencode "$1" ${2:+--data-urlencode "$2"} ${3:+--data-urlencode "$3"} ${4:+--data-urlencode "$4"} ${5:+--data-urlencode "$5"} | head -c 2500; echo; }
          q '$limit=3'
          q '$select=license_type,count(*) as n' '$group=license_type'
          q '$select=status,count(*) as n' '$group=status'
          q '$select=related_license_type,count(*) as n' '$group=related_license_type'
          q '$select=county,count(*) as n' '$group=county' '$order=n DESC' '$limit=15'
          q '$select=max(original_license_date) as d, min(original_license_date) as m'
          q "\$select=related_license_number,related_license_full_name,count(*) as n" "\$where=license_type='SALE' AND original_license_date > '2025-10-01'" '$group=related_license_number,related_license_full_name' '$order=n DESC' '$limit=15'
          echo; curl -sS -m 60 -G "$B" --data-urlencode "\$select=count(*) as n" --data-urlencode "\$where=license_type='SALE' AND original_license_date > '2025-10-01'"
          echo; curl -sS -m 60 -G "$B" --data-urlencode "\$select=related_license_number,count(*) as n" --data-urlencode "\$where=license_type='SALE' AND original_license_date > '2025-10-01'" --data-urlencode '$group=related_license_number' --data-urlencode '$limit=50000' | jq length
