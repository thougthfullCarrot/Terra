# Temporary: looks for a current TREC licensee file. Removed before merge.
name: Probe TREC
on:
  push:
    branches: [claude/project-thread-qweiqx]
    paths: ['.github/workflows/probe-trec.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          curl -sSL -m 60 -A "$UA" https://www.trec.texas.gov/public/high-value-data-sets -o /tmp/h.html -w "%{http_code}\n"
          grep -oiE 'href="[^"]+"' /tmp/h.html | grep -viE '\.css|\.js|#|twitter|facebook' | sort -u | head -80
          sed -e 's/<[^>]*>/ /g' /tmp/h.html | tr -s ' \n' | grep -iE 'license|data|update|txt|csv' | head -60
          echo "=== socrata s7ft-44qi"; curl -sS -m 30 "https://api.us.socrata.com/api/catalog/v1?ids=s7ft-44qi" | jq '.results[0] | {name: .resource.name, domain: .metadata.domain, updated: .resource.data_updated_at, cols: .resource.columns_name}'
          for u in $(grep -oiE 'href="[^"]+\.(txt|csv|zip|xlsx)"' /tmp/h.html | sed 's/href="//;s/"$//' | sort -u | head -15); do
            case "$u" in http*) ;; *) u="https://www.trec.texas.gov$u";; esac
            echo "=== $u"; curl -sSIL -m 30 -A "$UA" "$u" | grep -iE '^(HTTP|content-length|last-modified)'
          done
