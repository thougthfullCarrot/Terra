name: Probe property sources (temporary)
on:
  push:
    branches: [claude/project-thread-mb2zuu]
    paths: [.github/workflows/probe-property.yml, backend/probe.mjs, backend/src/property/**, backend/src/bin/export-property.ts]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --silent
      - run: npm run --silent export:property -- --fresh --dir /tmp/property
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      - run: node probe.mjs
