# Temporary: runs the market export to check metro-wide TABS development counts.
name: Probe TABS
on:
  push:
    branches: [claude/more-market-data-gnlj26]
    paths: [.github/workflows/probe-tabs.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Export market data
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: npm run --silent export:market 2>&1 | grep -i "tabs" || true
      - name: Counts per metro
        run: |
          jq -r '.developments.projects | group_by(.city)[] | "\(.[0].city): \(length) projects, exact \(map(select(.lat!=null and (.approximate|not)))|length), zip \(map(select(.approximate))|length), missing \(map(select(.lat==null))|length); places: \(map(.place)|group_by(.)|map("\(.[0])=\(length)")|join(", "))"' ../site/market.json
