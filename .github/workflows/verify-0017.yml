# One-off, read-only: what the live site actually serves. Never merged.
name: Check live site (one-off, read-only)
on:
  push:
    branches: [claude/verify-0017]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the live files
        run: |
          B=https://thougthfullcarrot.github.io/Terra
          for f in index.html config.js account.js watch-view.js markets-view.js devmap.js app.js; do
            curl -sS -D /tmp/h -o /tmp/$f "$B/$f?nocache=$RANDOM"; echo "== $f $(head -1 /tmp/h | tr -d '\r') bytes=$(wc -c < /tmp/$f) $(grep -i -E '^(last-modified|cache-control|age):' /tmp/h | tr -d '\r' | tr '\n' ' ')"
          done
          echo "== config watchlists:"; grep -o '"watchlists": *[a-z]*' /tmp/config.js || echo "no watchlists key"
          echo "== 'Follow this market' in markets-view.js: $(grep -c 'Follow this market' /tmp/markets-view.js)"
          echo "== watch_beta_access in account.js: $(grep -c watch_beta_access /tmp/account.js)"
          echo "== script tags / imports in index.html:"; grep -o '<script[^>]*>' /tmp/index.html
          echo "== imports of config:"; grep -n "config.js" /tmp/*.js /tmp/index.html | head
