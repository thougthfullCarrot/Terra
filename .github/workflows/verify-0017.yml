# One-off, read-only: who has signed in recently, and is it the tester. Never merged.
# No email or user id is printed.
name: Check tester sign-ins (one-off, read-only)
on:
  push:
    branches: [claude/verify-0017]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Read-only queries
        run: |
          ref="$(echo "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#')"
          q() { echo "== $1"; jq -n --arg q "$2" '{query: $q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @-; echo; }
          q tester "select u.last_sign_in_at::text tester_last_sign_in, split_part(u.email,'@',2) tester_domain, (select count(*) from private.watch_testers) testers from private.watch_testers t join auth.users u on u.id = t.user_id"
          q recent "select u.last_sign_in_at::text, split_part(u.email,'@',2) domain, exists (select 1 from private.watch_testers t where t.user_id = u.id) is_tester, public.is_college_email(u.email) college from auth.users u where coalesce(u.raw_app_meta_data->>'terra_test_user','false') <> 'true' order by u.last_sign_in_at desc nulls last limit 10"
          q items "select count(*) from public.watchlist_items"
          q sessions "select s.updated_at::text session_last_used, split_part(u.email,'@',2) domain, exists (select 1 from private.watch_testers t where t.user_id = u.id) is_tester from auth.sessions s join auth.users u on u.id = s.user_id where coalesce(u.raw_app_meta_data->>'terra_test_user','false') <> 'true' order by s.updated_at desc nulls last limit 8"
