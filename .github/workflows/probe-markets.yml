name: Probe new markets (temporary)
# rerun 2
on:
  push:
    branches: [claude/more-market-data-gnlj26]
    paths: [.github/workflows/probe-markets.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: TABS county ids
        run: |
          curl -sL -m 60 https://www.tdlr.texas.gov/TABS/Search > /tmp/tabs.html
          sed -n '/name="filter-location-county"/,/<\/select>/p' /tmp/tabs.html | grep -io '<option[^>]*value="[0-9]*"[^>]*>[^<]*' | grep -iE '>(Brazos|Burleson|Robertson|Galveston|Lubbock|Midland|Ector|Martin|Crosby|Lynn)\b' || true
      - name: HUD FMR metro areas
        env:
          HUD: ${{ secrets.HUD_API_TOKEN }}
        run: |
          curl -s -m 60 -H "Authorization: Bearer $HUD" https://www.huduser.gov/hudapi/public/fmr/listMetroAreas | tr '{' '\n' | grep -iE 'College Station|Lubbock|Midland|Odessa|Houston' || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Export market
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: |
          npm run --silent export:market -- --out /tmp/m.json 2>&1 | tail -60 || true
          node -e '
            const m = JSON.parse(require("fs").readFileSync("/tmp/m.json","utf8"));
            for (const c of ["College Station","Galveston","Lubbock","Midland"]) {
              const mk = (m.markets||[]).find(x => x.city === c);
              if (!mk) { console.log(c, "MISSING market"); continue; }
              const nulls = Object.entries(mk.values).filter(([,v]) => v == null).map(([k]) => k);
              console.log(`== ${c}: ${Object.keys(mk.values).length - nulls.length} set, null: ${nulls.join(", ")}`);
            }
            const dev = m.developments || m.devmap || null;
            const projects = (dev && (dev.projects || dev)) || [];
            const counts = {};
            for (const p of Array.isArray(projects) ? projects : []) counts[p.city] = (counts[p.city]||0)+1;
            console.log("TDLR projects per city:", JSON.stringify(counts));
            console.log("top keys:", Object.keys(m).join(","));
          ' || true
