name: Probe TABS city id (temporary)
on:
  push:
    branches: [claude/more-market-data-gnlj26]
    paths: [.github/workflows/probe-nb.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.tdlr.texas.gov/TABS
          for p in "" /Search /Search/Projects /Search/AdvancedSearch /Search/ProjectSearch /Home /Search/Search; do
            curl -sL -m 30 -o /tmp/p "$B$p"; echo "== $B$p $(wc -c </tmp/p) options=$(grep -c '<option' /tmp/p)"
            grep -io '<option[^>]*>[^<]*braunfels[^<]*' /tmp/p | head
            grep -io '<option[^>]*>[^<]*\(houston\|seguin\)[^<]*' /tmp/p | head -3
          done
          curl -sL -m 30 $B/Search | grep -io '\(href\|src\|action\|url\)[=:] *["'"'"'][^"'"'"']*' | sort -u | head -40
          for id in $(seq 1150 1260); do
            r=$(curl -s -m 20 -X POST $B/Search/SearchProjects -d "draw=1&start=0&length=1&LocationCity=$id&DataVersionId=900001&RegistrationDateBegin=01/01/2025&RegistrationDateEnd=10/05/2026" | grep -io '"[A-Za-z]*City[A-Za-z]*":"[^"]*"' | head -2 | tr '\n' ' ')
            [ -n "$r" ] && echo "$id $r"
          done
