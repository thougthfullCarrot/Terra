name: Probe New Braunfels (temporary)
on:
  push:
    branches: [claude/more-market-data-gnlj26]
    paths: [.github/workflows/probe-nb.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in https://www.tdlr.texas.gov/TABS/Search https://www.tdlr.texas.gov/TABS/Search/ProjectSearch https://www.tdlr.texas.gov/TABS/Search/GetCities https://www.tdlr.texas.gov/TABS/Search/Index; do echo "== $u"; curl -sL -m 30 "$u" | grep -io '.\{120\}braunfels.\{60\}' | head -5; done
          curl -sL -m 30 https://www.tdlr.texas.gov/TABS/Search | grep -io '<script[^>]*src="[^"]*"' | head
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: |
          npm run --silent export:market -- --out /tmp/m.json > /tmp/log 2>&1 || true
          grep -iE "braunfels|tax rates|redfin|zillow|apartment|bps|hud" /tmp/log | head -30
          node -e 'const s=require("/tmp/m.json");const m=s.markets.find(x=>x.city==="New Braunfels");console.log(JSON.stringify(m?.values))' || true
