# Temporary: probes the owner lookup's sources from a runner. Removed before merge.
name: Probe owner lookup
on:
  pull_request:
    paths: ['backend/scratch-probe/**', '.github/workflows/probe-owner.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node backend/scratch-probe/owner.mjs
