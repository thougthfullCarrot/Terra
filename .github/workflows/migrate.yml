# Applies new database migrations to the Supabase project.
#
# On a push to the default branch, every migration file the push *adds* is run
# once through the Supabase Management API, in name order. Files that already
# existed are never re-run, so editing an old migration changes nothing in the
# database. To run one by hand (for example after fixing a failed run), use
# "Run workflow" with its file name.
#
# Needs the variable SUPABASE_URL and the secret SUPABASE_ACCESS_TOKEN, the
# same pair the Email sender and Stripe webhook workflows use. Until they are
# set every run skips with a notice; paste the file into the SQL editor instead.
name: Database migrations

on:
  push:
    branches: [claude/new-session-6xvm0u]
    paths: ['backend/supabase/migrations/**']
  workflow_dispatch:
    inputs:
      file:
        description: Migration file name to run, e.g. 0007_email_alerts.sql
        required: true

permissions:
  contents: read

concurrency:
  group: migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the migrations to run
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_FILE: ${{ inputs.file }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_URL or SUPABASE_ACCESS_TOKEN is not set; run new migrations in the Supabase SQL editor instead."
            exit 0
          fi
          dir=backend/supabase/migrations
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            name="$(basename "$INPUT_FILE")"
            if ! [[ "$name" =~ ^[0-9]{4}_[a-z0-9_]+\.sql$ ]] || [ ! -f "$dir/$name" ]; then
              echo "::error::No migration named $INPUT_FILE in $dir"
              exit 1
            fi
            files="$dir/$name"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No previous commit to compare with; run migrations by hand."
            exit 0
          else
            files="$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- "$dir" | grep '\.sql$' | sort || true)"
          fi
          if [ -z "$files" ]; then
            echo "No new migrations."
            exit 0
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run them
        if: steps.pick.outputs.files != ''
        env:
          FILES: ${{ steps.pick.outputs.files }}
        run: |
          ref="$(echo "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#')"
          if [ "$ref" = "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL should look like https://<project>.supabase.co"
            exit 1
          fi
          echo '## Database migrations' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            code=$(jq -n --rawfile q "$file" '{query: $q}' | curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$ref/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @-)
            if [ "$code" -ge 300 ]; then
              echo "::error::$file failed ($code)"
              cat /tmp/resp.json
              echo "- $(basename "$file"): failed ($code)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "- $(basename "$file"): applied" >> "$GITHUB_STEP_SUMMARY"
            echo "Applied $file"
          done <<< "$FILES"
