# Builds the public website and publishes it on GitHub Pages.
#
# The site is static: this workflow runs a collector pass against the live
# boards (no database, no secrets), writes site/postings.json, and deploys the
# site/ folder. Refreshing it every two hours keeps it as current as the app.
#
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions". Until that is set the deploy step skips with a notice
# rather than failing on every schedule.
#
# Accounts (docs/accounts-setup.md): once the repository has the variables
# SUPABASE_URL and SUPABASE_ANON_KEY and the secret SUPABASE_SERVICE_ROLE_KEY,
# the site asks visitors to sign in. The snapshot then goes to Supabase, where
# only college emails and subscribers can read it, and postings.json is left
# out of the published site. Without them the site stays open, as before.
name: Website

on:
  push:
    branches: [claude/new-session-6xvm0u]
    paths: ['site/**', 'backend/**', '.github/workflows/site.yml']
  # Pull requests build the site, so a broken export shows up before merge,
  # but never deploy it.
  pull_request:
    paths: ['site/**', 'backend/**', '.github/workflows/site.yml']
  workflow_dispatch:
  schedule:
    # Offset from collect.yml's top of the hour; scheduled runs only fire on
    # the default branch.
    - cron: '20 */2 * * *'

# A new snapshot supersedes one still deploying.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Build the site's scripts
        run: npm run build:site

      - name: Export postings from the live boards
        # Optional. With these set, Adzuna search results join the board
        # postings; without them the site is built from the boards alone.
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          set -o pipefail
          npm run --silent export:site 2>&1 | tee /tmp/export.log

      - name: Summarize
        if: always()
        run: |
          {
            echo '## Website snapshot'
            echo
            if [ -f ../site/postings.json ]; then
              echo "- Postings: $(jq '.jobs | length' ../site/postings.json)"
              echo "- Boards: $(jq -c '.boards' ../site/postings.json)"
              echo "- Firms: $(jq -r '[.jobs[].firm] | unique | join(", ")' ../site/postings.json)"
            fi
            echo
            echo '```'
            tail -n 60 /tmp/export.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write account settings
        id: accounts
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_PAYMENT_LINK: ${{ vars.STRIPE_PAYMENT_LINK }}
          STRIPE_BILLING_PORTAL_LINK: ${{ vars.STRIPE_BILLING_PORTAL_LINK }}
          PRICE_LABEL: ${{ vars.PRICE_LABEL }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "Accounts not configured; publishing the open site."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # JSON.stringify quotes every value, so nothing in a variable can break out of the file.
          node -e '
            const config = {
              supabaseUrl: process.env.SUPABASE_URL.replace(/\/+$/, ""),
              supabaseAnonKey: process.env.SUPABASE_ANON_KEY,
              paymentLink: process.env.STRIPE_PAYMENT_LINK || "",
              billingPortalLink: process.env.STRIPE_BILLING_PORTAL_LINK || "",
              priceLabel: process.env.PRICE_LABEL || ""
            };
            require("fs").writeFileSync("../site/config.js",
              "// Written by site.yml from the repository variables.\nexport const CONFIG = " + JSON.stringify(config, null, 2) + ";\n");
          '
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "- Accounts: on (sign-in required; subscriptions $([ -n "$STRIPE_PAYMENT_LINK" ] && echo on || echo off))" >> "$GITHUB_STEP_SUMMARY"

      # Pull requests build with accounts on but never write the live feed.
      - name: Send the snapshot to Supabase
        if: steps.accounts.outputs.enabled == 'true' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          jq -c '{id: "current", data: ., updated_at: (now | todate)}' ../site/postings.json > /tmp/snapshot.json
          curl -fsS -X POST "${SUPABASE_URL%/}/rest/v1/site_snapshots?on_conflict=id" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data-binary @/tmp/snapshot.json
          echo "Snapshot stored in Supabase."

      # With accounts on, the feed is members-only: it must not also sit at a public URL.
      - name: Keep the feed out of the public site
        if: steps.accounts.outputs.enabled == 'true'
        run: rm -f ../site/postings.json

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check that Pages is turned on
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Explain the skip
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice::GitHub Pages is not enabled for this repository, so the site was built but not published. Turn it on under Settings > Pages > Source: GitHub Actions."
          {
            echo '## Website not published'
            echo
            echo 'GitHub Pages is off. Turn it on once under **Settings > Pages >'
            echo 'Build and deployment > Source: GitHub Actions**; the next run publishes.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
