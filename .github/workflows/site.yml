# Builds the public website and publishes it on GitHub Pages.
#
# The site is static: this workflow runs a collector pass against the live
# boards (no database, no secrets), writes site/postings.json, and deploys the
# site/ folder. Refreshing it every two hours keeps it as current as the app.
#
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions". Until that is set the deploy step skips with a notice
# rather than failing on every schedule.
#
# Accounts (docs/accounts-setup.md): once the repository has the variables
# SUPABASE_URL and SUPABASE_ANON_KEY and the secret SUPABASE_SERVICE_ROLE_KEY,
# the site asks visitors to sign in. The snapshot then goes to Supabase, where
# only college emails and subscribers can read it, and postings.json is left
# out of the published site. Without them the site stays open, as before.
#
# Market data (site/market.json, from BLS, the Census, Zillow, Apartment List
# and the appraisal district summary appraisal.yml caches) is built in the
# same job and gated the same way: with accounts on it goes to Supabase as the
# 'market' row and is left out of the published site.
#
# News (site/news.json): commercial real estate headlines per city from
# Google News search RSS (free, no key). Only headline, publisher, date and
# link are kept. Headlines are public, so the file stays published with
# accounts on.
#
# Events (site/events.json): real estate networking events per city from
# chapter calendars (CREDA Houston's events API, BOMA Dallas's GrowthZone
# calendar). Public like the news, so it stays published with accounts on.
#
# Google Sheets (docs/sheets-setup.md): with the secret
# GOOGLE_SERVICE_ACCOUNT_JSON and the variable TERRA_SHEET_ID, the firm list
# is read from the sheet's Firms tab (the seed list when the sheet can't be
# read), and builds on the default branch copy the jobs, market data and
# sign-ups into the sheet. Without them nothing changes.
name: Website

on:
  push:
    branches: [claude/new-session-6xvm0u]
    paths: ['site/**', 'backend/**', '.github/workflows/site.yml']
  # Pull requests build the site, so a broken export shows up before merge,
  # but never deploy it.
  pull_request:
    paths: ['site/**', 'backend/**', '.github/workflows/site.yml']
  workflow_dispatch:
  schedule:
    # Offset from collect.yml's top of the hour; scheduled runs only fire on
    # the default branch.
    - cron: '20 */2 * * *'

# A new snapshot supersedes one still deploying.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Build the site's scripts
        run: npm run build:site

      - name: Export postings from the live boards
        # Optional. With these set, Adzuna search results join the board
        # postings; without them the site is built from the boards alone.
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TERRA_SHEET_ID: ${{ vars.TERRA_SHEET_ID }}
          # Pull requests read the firm list but never write to the sheet.
          SHEETS_WRITE: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
        run: |
          set -o pipefail
          npm run --silent export:site 2>&1 | tee /tmp/export.log

      # Market data changes monthly (BLS) and yearly (Census), and keyless
      # BLS allows 25 requests a day, so a good file is cached for the day and
      # the APIs are asked once. A failed or partial pass keeps the last
      # cached figures for whatever it could not read.
      - name: Date for the market data cache
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The newest appraisal district summary appraisal.yml saved (weekly).
      - name: Restore appraisal district summary
        uses: actions/cache/restore@v4
        with:
          path: appraisal.json
          key: appraisal-none
          restore-keys: appraisal-

      # Keyed on the market code and the appraisal summary too, so a change to
      # either rebuilds the file the same day.
      - name: Restore market data
        id: market-cache
        uses: actions/cache/restore@v4
        with:
          path: site/market.json
          key: market-${{ hashFiles('backend/src/market/**', 'appraisal.json') }}-${{ steps.today.outputs.date }}
          restore-keys: market-

      - name: Export market data
        id: market
        if: steps.market-cache.outputs.cache-hit != 'true'
        # A market data outage must never hold back the job list.
        continue-on-error: true
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          set -o pipefail
          npm run --silent export:market 2>&1 | tee /tmp/market.log

      - name: Cache market data for the day
        if: steps.market.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: site/market.json
          key: market-${{ hashFiles('backend/src/market/**', 'appraisal.json') }}-${{ steps.today.outputs.date }}

      # Headlines change through the day, so they are fetched every run; a
      # city whose feed fails keeps the headlines the last deploy published.
      - name: Restore the last headlines
        uses: actions/cache/restore@v4
        with:
          path: site/news.json
          key: news-none
          restore-keys: news-

      - name: Export news headlines
        id: news
        # A news outage must never hold back the job list.
        continue-on-error: true
        run: |
          set -o pipefail
          npm run --silent export:news 2>&1 | tee /tmp/news.log

      - name: Cache the headlines
        if: steps.news.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: site/news.json
          key: news-${{ github.run_id }}-${{ github.run_attempt }}

      # Chapter event calendars, fetched every run; a source that fails keeps
      # the events the last deploy published.
      - name: Restore the last events
        uses: actions/cache/restore@v4
        with:
          path: site/events.json
          key: events-none
          restore-keys: events-

      - name: Export events
        id: events
        # An events outage must never hold back the job list.
        continue-on-error: true
        run: |
          set -o pipefail
          npm run --silent export:events 2>&1 | tee /tmp/events.log

      - name: Cache the events
        if: steps.events.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: site/events.json
          key: events-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize
        if: always()
        run: |
          {
            echo '## Website snapshot'
            echo
            if [ -f ../site/postings.json ]; then
              echo "- Postings: $(jq '.jobs | length' ../site/postings.json)"
              echo "- Boards: $(jq -c '.boards' ../site/postings.json)"
              echo "- Firms: $(jq -r '[.jobs[].firm] | unique | join(", ")' ../site/postings.json)"
            fi
            echo
            echo '```'
            tail -n 60 /tmp/export.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Market data'
            echo
            if [ -f ../site/market.json ]; then
              echo "- Built: $(jq -r '.generatedAt' ../site/market.json)$([ '${{ steps.market-cache.outputs.cache-hit }}' = 'true' ] && echo ' (cached today)')"
              echo "- Figures filled: $(jq '[.markets[].values[] | select(. != null)] | length' ../site/market.json) of $(jq '[.markets[].values[]] | length' ../site/market.json)"
            else
              echo "- No market data file."
            fi
            echo
            echo '```'
            cat /tmp/market.log 2>/dev/null || true
            echo '```'
            echo
            echo '## News'
            echo
            if [ -f ../site/news.json ]; then
              echo "- Headlines: $(jq -c '[.cities[] | {(.city): (.headlines | length)}] | add' ../site/news.json)"
            fi
            echo
            echo '```'
            cat /tmp/news.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Events'
            echo
            if [ -f ../site/events.json ]; then
              echo "- Events: $(jq -c '[.cities[] | {(.city): (.events | length)}] | add' ../site/events.json)"
            fi
            echo
            echo '```'
            cat /tmp/events.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write account settings
        id: accounts
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_PAYMENT_LINK: ${{ vars.STRIPE_PAYMENT_LINK }}
          STRIPE_BILLING_PORTAL_LINK: ${{ vars.STRIPE_BILLING_PORTAL_LINK }}
          PRICE_LABEL: ${{ vars.PRICE_LABEL }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "Accounts not configured; publishing the open site."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # JSON.stringify quotes every value, so nothing in a variable can break out of the file.
          node -e '
            const config = {
              supabaseUrl: process.env.SUPABASE_URL.replace(/\/+$/, ""),
              supabaseAnonKey: process.env.SUPABASE_ANON_KEY,
              paymentLink: process.env.STRIPE_PAYMENT_LINK || "",
              billingPortalLink: process.env.STRIPE_BILLING_PORTAL_LINK || "",
              priceLabel: process.env.PRICE_LABEL || ""
            };
            require("fs").writeFileSync("../site/config.js",
              "// Written by site.yml from the repository variables.\nexport const CONFIG = " + JSON.stringify(config, null, 2) + ";\n");
          '
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "- Accounts: on (sign-in required; subscriptions $([ -n "$STRIPE_PAYMENT_LINK" ] && echo on || echo off))" >> "$GITHUB_STEP_SUMMARY"

      # Pull requests build with accounts on but never write the live feed.
      - name: Send the snapshot to Supabase
        if: steps.accounts.outputs.enabled == 'true' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          jq -c '{id: "current", data: ., updated_at: (now | todate)}' ../site/postings.json > /tmp/snapshot.json
          curl -fsS -X POST "${SUPABASE_URL%/}/rest/v1/site_snapshots?on_conflict=id" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data-binary @/tmp/snapshot.json
          echo "Snapshot stored in Supabase."
          if [ -f ../site/market.json ]; then
            jq -c '{id: "market", data: ., updated_at: (now | todate)}' ../site/market.json > /tmp/market-row.json
            curl -fsS -X POST "${SUPABASE_URL%/}/rest/v1/site_snapshots?on_conflict=id" \
              -H "apikey: $SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              --data-binary @/tmp/market-row.json
            echo "Market data stored in Supabase."
          fi

      # Runs before the feed files are removed below. A Sheets problem must
      # never hold back the site, so it can fail without failing the build.
      - name: Copy jobs, market data and sign-ups to Google Sheets
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TERRA_SHEET_ID: ${{ vars.TERRA_SHEET_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run --silent sync:sheets

      # With accounts on, the feed is members-only: it must not also sit at a public URL.
      - name: Keep the feed out of the public site
        if: steps.accounts.outputs.enabled == 'true'
        run: rm -f ../site/postings.json ../site/market.json

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check that Pages is turned on
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Explain the skip
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice::GitHub Pages is not enabled for this repository, so the site was built but not published. Turn it on under Settings > Pages > Source: GitHub Actions."
          {
            echo '## Website not published'
            echo
            echo 'GitHub Pages is off. Turn it on once under **Settings > Pages >'
            echo 'Build and deployment > Source: GitHub Actions**; the next run publishes.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
