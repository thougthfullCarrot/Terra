# Temporary: print the current market.json figures from the Website build's
# cache, so a design change can be mocked up against the real numbers rather
# than invented ones. Manual trigger only; reads the cache, writes nothing.
name: Market data dump

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Website build's last data, from its caches on the default branch.
      - name: Restore market data
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: site/market.json
          key: market-none
          restore-keys: market-

      - name: Dump the figures
        run: |
          if [ ! -f site/market.json ]; then
            echo "NO CACHED market.json — the Website workflow has not built one, or the cache expired."
            exit 1
          fi
          echo "=== size ==="
          wc -c site/market.json
          echo "=== top-level keys ==="
          jq -r 'keys[]' site/market.json
          echo "=== generatedAt ==="
          jq -r '.generatedAt // "none"' site/market.json
          echo "=== groups ==="
          jq -c '[.groups[]? | {key, label, metrics}]' site/market.json
          echo "=== metric definitions ==="
          jq -c '[.metrics[]? | {key, label, unit, source, better}]' site/market.json
          echo "=== cities ==="
          jq -r '[.markets[].city] | join(", ")' site/market.json
          echo "=== every market, every value ==="
          jq -c '.markets[] | {city, metro, values, status}' site/market.json
          echo "=== refresh status ==="
          jq -c '.refresh // []' site/market.json
