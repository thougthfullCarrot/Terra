# Runs a collector pass every 2 hours.
#
# This is the alternative to Vercel Cron, and the better one on a Hobby plan:
# Vercel runs cron once a day there regardless of the expression, and caps a
# function at 60s. A runner has neither limit, which matters once Workday
# tenants are in the firm list.
name: Collect postings

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

# A slow pass must never overlap the next one: two collectors writing the same
# postings would race on first_seen.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      # A scheduled job that cannot possibly succeed must not report failure on
      # every firing. Before this check the workflow failed 40 times in a week
      # for want of credentials nobody had added yet — which teaches everyone to
      # ignore a red X on this repo, and that is worse than no signal at all.
      - name: Check for credentials
        id: creds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::No Supabase credentials — skipping. Add SUPABASE_URL and           SUPABASE_SERVICE_ROLE_KEY under Settings > Secrets and variables > Actions."
            {
              echo '## Collector skipped'
              echo
              echo 'There is nowhere to write postings yet: `SUPABASE_URL` and'
              echo '`SUPABASE_SERVICE_ROLE_KEY` are not set as repository secrets.'
              echo 'The collector will start running on its own once they are.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        if: steps.creds.outputs.skip != 'true'

      - name: Run one pass
        if: steps.creds.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: |
          set +e
          npm run --silent collect 2>&1 | tee /tmp/collect.json
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        id: collect

      - name: Publish the run report
        if: always() && steps.creds.outputs.skip != 'true'
        run: |
          {
            echo '## Collector run'
            echo
            echo '```json'
            cat /tmp/collect.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `npm run collect` exits non-zero when a pass keeps zero postings. That
      # is the failure that matters here: the run "succeeded" and the feed is
      # empty.
      - name: Fail on an empty pass
        if: steps.creds.outputs.skip != 'true' && steps.collect.outputs.exit_code != '0'
        run: exit 1
