name: Development map filter timing (read-only)

# Times the dev map's filter change on this branch and on the default branch,
# with the same restored data, browser settings and Houston filter action, in
# alternating rounds so runner load hits both alike. Read-only: no secrets,
# no deploy, no data written.
on:
  workflow_dispatch:
  push:
    branches: ['claude/project-thread-kacweq']
    paths:
      - site/devmap.js
      - backend/test/browser/devmap-timing.mjs
      - .github/workflows/devmap-timing.yml

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-6xvm0u
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build both sites
        run: |
          for d in pr base; do (cd $d/backend && npm ci --silent && npm run --silent build:site); done
          (cd pr/backend && npx playwright-core install --with-deps chromium > /dev/null)

      # The Website build's last data (default branch caches), copied into both sites.
      - name: Restore market data
        uses: actions/cache/restore@v4
        with:
          path: site/market.json
          key: market-none
          restore-keys: market-
      - name: Restore development lists
        uses: actions/cache/restore@v4
        with:
          path: site/developments
          key: devlists-none
          restore-keys: devlists-
      - name: Same data in both
        run: |
          for d in pr base; do cp site/market.json $d/site/market.json; rm -rf $d/site/developments; cp -r site/developments $d/site/developments; done
          echo "PR: $(git -C pr rev-parse --short HEAD); default branch: $(git -C base rev-parse --short HEAD)"

      - name: Time both, alternating
        working-directory: pr/backend
        run: |
          set -o pipefail
          for i in 1 2 3; do
            node test/browser/devmap-timing.mjs "pr-$i" ../site 4 | tee -a /tmp/timing.jsonl
            node test/browser/devmap-timing.mjs "base-$i" ../../base/site 4 | tee -a /tmp/timing.jsonl
          done
          { echo '## Filter timing'; echo '```'; cat /tmp/timing.jsonl; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
