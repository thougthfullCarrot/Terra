# Temporary: probes candidate event sources from a runner. Removed before merge.
name: Probe event sources
on:
  pull_request:
    paths: ['backend/scratch-probe/**', '.github/workflows/probe-events.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node backend/scratch-probe/probe.mjs
