name: Probe event sources (temporary)
on:
  push:
    branches: [claude/more-market-data-gnlj26]
    paths: [.github/workflows/probe-events.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Export events (live run 1)
        run: |
          npm run --silent export:events -- --out /tmp/events.json --previous /nonexistent 2>&1 | grep -vE '^  20'
          jq -c '[.cities[] | {(.city): (.events | length)}] | add' /tmp/events.json
          jq -c '.sources' /tmp/events.json
          jq -r '.cities[].events[] | "\(.city) | \(.start[0:16]) | \(.organizer) | \(.title)"' /tmp/events.json
