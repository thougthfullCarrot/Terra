name: Development audit (dry run)

# Reads public sources (TDLR TABS, Census geocoder and ZIP centers, city open
# data) and writes reports as a workflow artifact. No secrets, no Supabase, no
# Sheet, no site deploy. Runs by hand, and on pushes to the audit branch.
on:
  workflow_dispatch:
    inputs:
      markets:
        description: Comma-separated markets (blank = every configured market)
        required: false
      max_minutes:
        description: Stop starting new reads after this many minutes (resume on the next run)
        required: false
        default: '150'
  push:
    branches: ['claude/dev-collection-audit-*']
    paths:
      - backend/src/market/devAudit.ts
      - backend/src/bin/audit-developments.ts
      - .github/workflows/dev-audit.yml

permissions:
  contents: read

concurrency:
  group: dev-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      # Searches, pages and geocodes from earlier runs, so an interrupted run resumes.
      - name: Restore audit cache
        uses: actions/cache/restore@v4
        with:
          path: dev-audit-cache
          key: dev-audit-${{ github.run_id }}
          restore-keys: dev-audit-

      # The live site's last build: pages it already read are reused, not fetched again.
      - name: Fetch the published market data
        run: curl -fsSL --max-time 120 -o /tmp/market.json https://thougthfullcarrot.github.io/Terra/market.json || echo "no previous build"

      - name: Run the audit
        env:
          MARKETS: ${{ inputs.markets }}
          MAX_MINUTES: ${{ inputs.max_minutes || '150' }}
        run: |
          set -o pipefail
          args=(--out ../dev-audit-output --cache ../dev-audit-cache --previous /tmp/market.json --max-minutes "$MAX_MINUTES")
          if [ -n "$MARKETS" ]; then args+=(--markets "$MARKETS"); fi
          /usr/bin/time -v npm run --silent audit:developments -- "${args[@]}" 2>&1 | tee /tmp/audit.log

      - name: Save audit cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dev-audit-cache
          key: dev-audit-${{ github.run_id }}

      - name: Print reports
        if: always()
        run: |
          for f in ../dev-audit-output/summary.md ../dev-audit-output/traces.md ../dev-audit-output/*.md; do
            [ -f "$f" ] && { echo "=====FILE $(basename "$f")====="; cat "$f"; echo; }
          done
          cat ../dev-audit-output/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-audit-output
          path: dev-audit-output
          retention-days: 14
