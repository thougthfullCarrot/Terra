name: Probe lease, report and parcel sources (temporary)
on:
  push:
    branches: [claude/project-thread-lhin74]
    paths: [.github/workflows/probe-sources.yml, backend/probe.mjs, backend/src/market/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --silent
        working-directory: backend
      - run: npm run --silent export:sites -- --out /tmp/sites.json
        working-directory: backend
      - run: npx tsx probe.mjs
        working-directory: backend
