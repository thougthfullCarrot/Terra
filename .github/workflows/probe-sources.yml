name: Probe lease, report and parcel sources (temporary)
on:
  push:
    branches: [claude/project-thread-lhin74]
    paths: [.github/workflows/probe-sources.yml, backend/probe.mjs]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --silent
        working-directory: backend
      - run: node probe.mjs
        working-directory: backend
