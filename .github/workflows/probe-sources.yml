name: Probe market sources
on:
  push:
    branches: [claude/more-market-data-gnlj26]
    paths: [.github/workflows/probe-sources.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env: { T: "${{ secrets.HUD_API_TOKEN }}" }
        run: |
          curl -s -H "Authorization: Bearer $T" https://www.huduser.gov/hudapi/public/fmr/listMetroAreas | tr '{' '\n' | grep -i "worth\|dallas"
          for u in https://lihtc.huduser.gov/LIHTCPUB.ZIP https://www.huduser.gov/lihtc/LIHTCPUB.ZIP https://www.huduser.gov/portal/datasets/lihtc/LIHTCPUB.ZIP https://www.huduser.gov/portal/datasets/lihtc.html; do echo "== $u"; curl -sIL -m 30 "$u" | grep -i "^HTTP\|content-type\|content-length\|location"; done
          curl -sL https://www.huduser.gov/portal/datasets/lihtc.html | grep -io 'href="[^"]*\(zip\|csv\|xlsx\)[^"]*"' | head
