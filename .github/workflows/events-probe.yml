# TEMPORARY: probes candidate event calendars from a runner. Removed before merge.
name: Events probe
on:
  push:
    branches: [claude/project-thread-6j2ua3]
    paths: ['backend/src/bin/probe-event-sources.ts', '.github/workflows/events-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx tsx src/bin/probe-event-sources.ts
