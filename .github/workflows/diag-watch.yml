name: Diag watch audit (read-only)
on: push
permissions: { contents: read }
jobs:
  read:
    if: github.ref_name == 'claude/diag-watch-audit'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only checks (one SELECT)
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          jq -n --rawfile q backend/diag-watch.sql '{query: $q}' | curl -fsS -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @- | jq '.[0].report'
