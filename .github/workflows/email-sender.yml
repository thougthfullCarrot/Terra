# Points Supabase's sign-in emails at a real SMTP sender so they aren't capped
# at Supabase's built-in few-per-hour limit, and raises the hourly email limit.
#
# Needs the secrets SUPABASE_ACCESS_TOKEN, SMTP_USER (a Gmail address) and
# SMTP_PASSWORD (a Gmail app password), plus the variable SUPABASE_URL.
# Optional variables: SMTP_HOST (default smtp.gmail.com), SMTP_PORT (587),
# SMTP_SENDER_NAME (Terra).
name: Email sender

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_SENDER_NAME: ${{ vars.SMTP_SENDER_NAME || 'Terra' }}
    steps:
      - name: Set the SMTP sender in Supabase
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "::error::Set SUPABASE_URL, SUPABASE_ACCESS_TOKEN, SMTP_USER and SMTP_PASSWORD first (docs/accounts-setup.md)."
            exit 1
          fi
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          body=$(jq -n --arg host "$SMTP_HOST" --arg port "$SMTP_PORT" --arg user "$SMTP_USER" \
            --arg pass "$SMTP_PASSWORD" --arg name "$SMTP_SENDER_NAME" \
            '{smtp_host:$host, smtp_port:$port, smtp_user:$user, smtp_pass:$pass,
              smtp_admin_email:$user, smtp_sender_name:$name, rate_limit_email_sent:100}')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$ref/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")
          if [ "$code" -ge 300 ]; then echo "::error::Supabase answered $code"; cat resp.json; exit 1; fi
          echo "Sign-in emails now go out from $SMTP_USER, up to 100 an hour." >> "$GITHUB_STEP_SUMMARY"
